<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的菜谱</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
header{padding:18px 16px 12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #eee}h1{margin:0 0 12px;font-size:30px}
input,textarea{font:inherit}#search{width:100%;padding:12px;border:0;border-radius:12px;background:#f0f0f2;font-size:16px}
main{padding:14px 14px 100px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.card h2{margin:0 0 6px;font-size:19px}.muted{color:#777;font-size:13px}
.empty{text-align:center;color:#777;padding:70px 20px}.fab{position:fixed;right:20px;bottom:25px;width:58px;height:58px;border:0;border-radius:50%;background:#111;color:#fff;font-size:30px;z-index:3}
.modal{display:none;position:fixed;inset:0;background:#fff;z-index:5;overflow:auto}.modal.show{display:block}
.bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:2}.bar button{border:0;background:none;font-size:17px}.save{font-weight:600}
.form,.detail{padding:18px}.form label{display:block;font-weight:600;margin:16px 0 7px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.form textarea{min-height:130px;resize:vertical}.detail h2{font-size:28px}.section{margin:25px 0}.section h3{font-size:18px}.section p{white-space:pre-wrap;line-height:1.7}.danger{color:#d00;border:0;background:none;font-size:16px;padding:10px 0}
</style>
</head>
<body>
<header><h1>我的菜谱</h1><input id="search" placeholder="搜索菜谱"></header>
<main id="list"></main>
<button class="fab" onclick="newRecipe()">＋</button>

<div id="editor" class="modal">
 <div class="bar"><button onclick="closeEditor()">取消</button><b id="editorTitle">新建菜谱</b><button class="save" onclick="save()">保存</button></div>
 <div class="form">
  <label>菜名</label><input id="name" placeholder="例如：番茄炒蛋">
  <label>食材</label><textarea id="ingredients" placeholder="番茄 2个&#10;鸡蛋 3个&#10;盐 2g"></textarea>
  <label>我的做法</label><textarea id="steps" placeholder="1. 鸡蛋打散&#10;2. 番茄切块&#10;3. ……"></textarea>
  <label>我的备注</label><textarea id="notes" placeholder="下次做的时候……"></textarea>
 </div>
</div>

<div id="detail" class="modal">
 <div class="bar"><button onclick="closeDetail()">返回</button><b>菜谱</b><button onclick="edit()">编辑</button></div>
 <div id="detailBody" class="detail"></div>
</div>

<script>
let data=JSON.parse(localStorage.getItem("myRecipesSafari")||"[]"), editing=null,current=null;
const $=x=>document.getElementById(x);
function saveData(){localStorage.setItem("myRecipesSafari",JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 let q=$("search").value.trim().toLowerCase(), a=data.filter(x=>x.name.toLowerCase().includes(q));
 $("list").innerHTML=a.length?a.map(x=>`<div class="card" onclick="detail('${x.id}')"><h2>${esc(x.name)}</h2><div class="muted">${new Date(x.updated).toLocaleDateString("zh-CN")}</div>${x.ingredients?`<div class="muted" style="margin-top:7px">${esc(x.ingredients.split("\\n").slice(0,2).join(" · "))}</div>`:""}</div>`).join(""):`<div class="empty">🍳<br><br>${q?"没有找到菜谱":"还没有菜谱"}<br><br>点击右下角 ＋ 添加第一道菜</div>`;
}
function newRecipe(){editing=null;openForm()}
function openForm(){
 $("editorTitle").textContent=editing?"编辑菜谱":"新建菜谱";
 let r=editing?data.find(x=>x.id===editing):null;
 $("name").value=r?.name||"";$("ingredients").value=r?.ingredients||"";$("steps").value=r?.steps||"";$("notes").value=r?.notes||"";
 $("editor").classList.add("show");
}
function closeEditor(){$("editor").classList.remove("show")}
function save(){
 let name=$("name").value.trim();if(!name){alert("请先填写菜名");return}
 let obj={name,ingredients:$("ingredients").value,steps:$("steps").value,notes:$("notes").value,updated:Date.now()};
 if(editing){let i=data.findIndex(x=>x.id===editing);data[i]={...data[i],...obj}}else data.unshift({id:String(Date.now()),...obj});
 saveData();closeEditor();render()
}
function detail(id){
 current=data.find(x=>x.id===id);if(!current)return;
 $("detailBody").innerHTML=`<h2>${esc(current.name)}</h2>${sec("食材",current.ingredients)}${sec("我的做法",current.steps)}${sec("我的备注",current.notes)}<button class="danger" onclick="remove()">删除这道菜</button>`;
 $("detail").classList.add("show")
}
function sec(t,v){return v?`<div class="section"><h3>${t}</h3><p>${esc(v)}</p></div>`:""}
function closeDetail(){$("detail").classList.remove("show")}
function edit(){editing=current.id;closeDetail();openForm()}
function remove(){if(confirm("确定删除这道菜吗？")){data=data.filter(x=>x.id!==current.id);saveData();closeDetail();render()}}
$("search").addEventListener("input",render);render();
</script>
</body>
</html>
